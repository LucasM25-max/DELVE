# GDD-06 §10 — release-asset upload utility.
#
# Why this exists: the agent sandbox can reach github.com / api.github.com but NOT
# uploads.github.com (asset-upload egress is blocked), so binary artifacts are
# uploaded from a GitHub-hosted runner instead. Used by M0 tasks T-03/T-04 —
# "binaries belong in Releases, never in the repository tree".
#
# How to use: edit the ENV block below (tag/title/asset/notes), commit, push —
# the push to this file triggers the run (the `paths` filter keeps every other
# push from re-triggering it). For a new task, remember the asset file must be
# present in the tree at that commit.
name: Upload release asset

on:
  push:
    branches:
      - arena/01a0cdae-delve
    paths:
      - '.github/workflows/upload-release-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # Default ref = the pushed commit; the asset must exist in-tree there.
      - uses: actions/checkout@v4

      - name: Create release (idempotent) and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.3.0-godot-3d
          TITLE: v0.3.0-godot-3d — DELVE Godot 4.7.2 project (3D era)
          ASSET: DELVE_Godot_4.7.2.zip
          NOTES: |
            **DELVE — Godot 4.7.2 project snapshot, 3D era (v0.3.0-godot).**

            Importable Godot 4.7.2 **Standard** project ZIP: menu shell + 3D test-yard blockout,
            Compatibility renderer, Sky3D addon — exactly as shipped at project version `0.3.0-godot`.

            - **Why a Release:** GDD-06 hygiene finding H3 / task T-03 — binary artifacts belong in
              GitHub Releases, never in the repository tree. The 69 MB ZIP was untracked in Git and
              the root `.gitignore` carries `*.zip`.
            - **Use it:** extract, then Godot Project Manager → **Import** → `project.godot`
              (step-by-step in `godot/GETTING_STARTED.md` §2). Editor and export templates must both
              be **4.7.2 Standard**.
            - **Rebuild from source:** `python3 godot/tools/package_project.py`
              (writes `deliverables/DELVE_Godot_4.7.2.zip`).
            - **Tag:** points at `cb9b07c`, the mainline commit that carried this ZIP at version
              `0.3.0-godot`, before the GDD-06 pixel-pivot hygiene work (T-01/T-02).

            Unofficial, non-commercial fan project — see the legal/attribution screen in-game and the
            rights notes in GDD-06 §15. Never sold; no warranty.
        run: |
          set -euo pipefail
          test -f "$ASSET" || { echo "::error::asset '$ASSET' not in tree at this commit"; exit 1; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ASSET"
          echo "--- release state after upload ---"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets --jq '{tag:.tagName,draft:.isDraft,assets:[.assets[]|{name:.name,size:.size}]}'
